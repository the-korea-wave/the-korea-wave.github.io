baseURL = "https://wave.koreasignals.com/"
title = "The Korea Wave"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
languageCode = "en-US"
enableRobotsTXT = true
timeZone = "Asia/Seoul"

# English stays at the existing root URLs; Korean translation pairs use /ko/.
[languages]
  [languages.en]
    label = "English"
    weight = 1
  [languages.ko]
    label = "한국어"
    weight = 2
    [languages.ko.params]
      date_format              = "2006년 1월 2일"
      label_ai_image           = "AI 생성 이미지"
      label_all_categories     = "← 모든 카테고리"
      label_categories         = "카테고리"
      label_categories_desc    = "카테고리별 기사를 살펴보세요."
      label_count_suffix       = "개 기사"
      label_home               = "홈"
      label_keywords_desc      = "키워드별 기사를 살펴보세요."
      label_keywords_empty     = "아직 키워드가 없습니다."
      label_next               = "다음 →"
      label_no_posts           = "이 카테고리에 기사가 없습니다."
      label_pagination         = "페이지 이동"
      label_prev               = "← 이전"
      label_read_more          = "더 읽기 →"
      label_recent             = "최근 기사"
      label_related            = "관련 기사"
      label_search             = "검색"
      label_search_empty       = "검색 결과가 없습니다."
      label_search_noscript    = "검색하려면 JavaScript가 필요합니다."
      label_search_placeholder = "기사 검색…"
      label_taxonomy_desc      = "분류별 기사를 살펴보세요."
      label_taxonomy_empty     = "아직 분류가 없습니다."
      label_view_all           = "전체 보기 →"

# 홈에서 검색 색인(index.json) + LLM 인덱스(llms.txt) 생성 — media-hugo-shared 모듈 소비
[outputs]
  home = ["HTML", "RSS", "JSON", "llms"]

[outputFormats.llms]
  mediaType = "text/plain"
  baseName  = "llms"
  isPlainText = true

[params]
  home_layout   = "magazine"
  site_key       = "the_korea_wave"
  tier           = "B"
  description    = "The business of Korean culture — industry and analysis coverage of K-pop, K-drama, and Korean entertainment, synthesized from multiple Korean sources."
  og_site_name   = "The Korea Wave"
  og_locale      = "en_US"
  logo           = "/brand/wordmark.svg"
  logo_dark      = "/brand/wordmark-dark.svg"
  og_image       = "images/og-default.png"
  show_hero      = true
  label_ai_image = "AI-generated illustration"
  gtm_id         = "GTM-5B6XBNBH"
  # WP-49: GSC HTML 태그 인증 (Google 계정 단위 토큰 — 속성마다 다를 필요 없음)
  verify_google  = "EvHXpDorbbKE9CntN4aVXNtiENA4ilq7byW4ncIlBSw"
  # WP-55: 네이버 서치어드바이저 HTML 태그 인증 (프로퍼티별 토큰 — 사이트마다 다름)
  verify_naver   = "2825d3e1d5d7b0df0315581a8d07bb44a0036995"
  verify_bing    = ""
  adsense_pub_id = ""
  daum_verification = ""
  show_term_chips = true
  accent_color   = "#7048e8"
  # i18n (WP-64): media-hugo-shared 라벨 파라미터 — 영문 매체용 값
  date_format               = "January 2, 2006"
  label_home                = "Home"
  label_search              = "Search"
  label_search_placeholder  = "Search articles…"
  label_recent              = "Recent Articles"
  label_categories          = "Categories"
  label_all_categories      = "← All Categories"
  label_related             = "Related Articles"
  label_no_posts            = "No articles in this category."
  label_count_suffix        = " articles"
  label_llms_posts_heading  = "Articles"
  label_taxonomy_desc       = "Browse articles by category."
  label_categories_desc     = "Browse articles by category."
  label_keywords_desc       = "Browse articles by keyword."
  label_taxonomy_empty      = "No categories yet."
  label_keywords_empty      = "No keywords yet."
  label_search_empty        = "No results"
  label_search_noscript     = "Search requires JavaScript."
  label_read_more           = "Read more →"
  label_prev                = "← Previous"
  label_next                = "Next →"
  label_pagination          = "Pagination"

[pagination]
  pagerSize = 20

[taxonomies]
  category = "categories"
  keyword  = "keywords"

[[menu.main]]
  name   = "Home"
  url    = "/"
  weight = 1

[[menu.main]]
  name   = "Categories"
  url    = "/categories/"
  weight = 2

[[menu.main]]
  name   = "About"
  url    = "/about/"
  weight = 3

[[menu.main]]
  name   = "Contact"
  url    = "/contact/"
  weight = 4

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/thishw/media-hugo-shared"
